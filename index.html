<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>After Hours Compendium</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&family=VT323&display=swap" rel="stylesheet">
<style>
/* Layout: the hilltop scene fills the screen as one low-res canvas (364x204, scaled up with hard pixels), animated in place.
   A wooden signpost sidebar on the left holds the links; on phones it becomes a row of planks at the bottom. Single theme by choice. */
:root{
  --ink:#140f0b;
  --bark:#5a3d22;
  --bark-hi:#80592f;
  --bark-lo:#33220f;
  --cream:#fbebc8;
  --gold:#f4c16a;
  --moss:#1e2b1a;
  --display:"Pixelify Sans", "Courier New", monospace;
  --body:"VT323", "Courier New", monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--ink)}
body{font-family:var(--body);color:var(--cream)}
#bg,#scene{position:absolute;image-rendering:pixelated;image-rendering:crisp-edges;display:block}
.stage{position:fixed;inset:0;overflow:hidden}

/* sidebar */
nav{position:fixed;left:18px;top:18px;bottom:18px;width:230px;z-index:5;display:flex;flex-direction:column;gap:14px;
  padding:16px 14px;background:rgba(20,15,11,.72);
  border:3px solid var(--ink);box-shadow:0 0 0 3px var(--bark),0 0 0 6px var(--ink),6px 8px 0 6px rgba(0,0,0,.35)}
.brand{font-family:var(--display);font-weight:700;color:var(--gold);font-size:26px;line-height:1.05;margin:0;
  text-shadow:3px 3px 0 var(--ink);letter-spacing:.02em}
.brand small{display:block;font-family:var(--body);font-weight:400;font-size:18px;color:var(--cream);opacity:.8;margin-top:6px;text-shadow:none;letter-spacing:0}
.links{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.plank{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:10px;width:100%;
  padding:7px 12px 9px;font-family:var(--display);font-size:19px;color:var(--cream);
  background:var(--bark);border:3px solid var(--ink);
  box-shadow:inset 0 3px 0 var(--bark-hi),inset 0 -4px 0 var(--bark-lo),3px 3px 0 var(--ink);
  transition:transform .08s steps(2)}
.plank canvas{width:24px;height:24px;image-rendering:pixelated;flex:0 0 24px}
.plank:hover,.plank:focus-visible{transform:translate(-1px,-2px);color:var(--gold);
  box-shadow:inset 0 3px 0 var(--bark-hi),inset 0 -4px 0 var(--bark-lo),4px 5px 0 var(--ink),0 0 0 2px var(--gold)}
.plank:active{transform:translate(2px,2px);box-shadow:inset 0 4px 0 var(--bark-lo),inset 0 -2px 0 var(--bark-hi),1px 1px 0 var(--ink)}
.plank:focus-visible{outline:none}
.foot{margin-top:auto;font-size:17px;opacity:.7}

/* dialog */
.dialog{position:fixed;left:calc(50% + 125px);top:24px;transform:translateX(-50%);z-index:6;width:min(560px,calc(100% - 300px));
  background:rgba(16,18,36,.9);padding:14px 18px 16px;font-size:24px;line-height:1.15;
  border:3px solid var(--ink);box-shadow:0 0 0 3px var(--gold),0 0 0 6px var(--ink);display:none;cursor:pointer}
.dialog.on{display:block}
.dialog b{font-family:var(--display);font-weight:600;color:var(--gold);font-size:18px;display:block;margin-bottom:4px}
.dialog i{font-style:normal;color:var(--gold);animation:blink 1s steps(2) infinite;float:right}
@keyframes blink{50%{opacity:0}}

@media (max-width:760px){
  nav{left:10px;right:10px;top:auto;bottom:10px;width:auto;padding:10px;gap:8px}
  .brand{font-size:20px}.brand small{display:none}
  .links{flex-direction:row;overflow-x:auto;gap:8px;padding:2px 4px 6px}
  .plank{width:auto;flex:0 0 auto;font-size:16px;padding:6px 10px 8px}
  .foot{display:none}
  .dialog{left:50%;width:calc(100% - 20px);bottom:auto;top:12px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="stage"><canvas id="bg" width="728" height="408" aria-hidden="true"></canvas><canvas id="scene" width="364" height="204" role="img" aria-label="Um rapaz de headphones a ler à sombra de uma árvore grande, no alto de um monte, com duas pegas num ramo e um vale com rio e cascata ao fundo"></canvas></div>

<nav aria-label="Páginas">
  <h1 class="brand">After Hours Compendium<small>um sítio meu, depois de horas</small></h1>
  <ul class="links">
    <li><button class="plank" data-icon="note" data-page="Música">Música</button></li>
    <li><button class="plank" data-icon="book" data-page="Estante">Estante</button></li>
    <li><button class="plank" data-icon="dagger" data-page="Diary of Skumm">Skumm</button></li>
    <li><button class="plank" data-icon="bar" data-page="Treino">Treino</button></li>
    <li><button class="plank" data-icon="gear" data-page="Oficina">Oficina</button></li>
    <li><button class="plank" data-icon="leaf" data-page="Natureza">Natureza</button></li>
  </ul>
  <div class="foot">▶ escolhe um caminho</div>
</nav>

<div class="dialog" id="dialog" role="status" aria-live="polite"><b id="dlgTitle"></b><span id="dlgText"></span> <i>▼</i></div>

<script>
(function(){
  var W=364,H=204;
  var cv=document.getElementById("scene"),ctx=cv.getContext("2d"),bg=document.getElementById("bg"),bctx=bg.getContext("2d");
  ctx.imageSmoothingEnabled=false;
  var still=window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var img=new Image();
  img.src="img/scene.png";
  var WF="293,121;293,122;293,123;293,124;293,125;294,116;294,117;294,118;294,119;294,120;294,121;294,122;294,123;294,125;294,126;295,111;295,112;295,113;295,114;295,115;295,116;295,117;295,118;295,119;295,120;295,121;296,110;296,111;296,112;296,113;297,109;297,110;298,106;298,107;298,108;298,121;298,122;298,123;298,124;298,125;299,105;299,106;299,117;299,118;299,119;299,120;299,121;299,122;299,123;299,124;299,125;300,109;300,110;300,111;300,112;300,113;300,114;300,115;300,116;300,117;300,118;300,119;300,120;300,121;301,107;301,108;301,109;301,110;302,107".split(";").map(function(p){return p.split(",").map(Number);});
  var RIV="179,133;179,134;180,134;181,134;181,135;182,134;182,135;182,136;183,134;183,135;183,136;183,137;184,136;184,137;185,135;185,136;185,137;186,134;186,137;186,138;187,134;187,137;187,138;188,134;189,132;190,132;190,139;191,131;191,132;191,139;192,131;192,132;193,131;193,132;193,140;194,131;194,132;194,140;195,131;195,132;196,131;196,132;197,131;197,132;198,131;200,142;201,142;202,141;202,142;203,141;203,142;203,143;204,141;204,142;204,143;205,142;205,143;206,141;206,142;206,143;207,142;207,143;208,130;208,142;208,143;209,130;209,143;210,130;210,143;211,143".split(";").map(function(p){return p.split(",").map(Number);});

  /* fit: cover the screen, keep the reader in view */
  function fit(){
    var vw=innerWidth,vh=innerHeight,s=Math.max(vw/W,vh/H),w=W*s,h=H*s;
    var focus=vw>760?0.40:0.40, anchor=vw>760?0.58:0.5;
    var left=Math.min(0,Math.max(vw-w,vw*anchor-focus*w));
    var top=Math.min(0,Math.max(vh-h,vh*0.62-0.72*h));
    [cv,bg].forEach(function(e){e.style.width=w+"px";e.style.height=h+"px";e.style.left=left+"px";e.style.top=top+"px";});
  }
  fit();addEventListener("resize",fit);

  function sprite(rows,x,y,col,a){
    ctx.globalAlpha=a==null?1:a;ctx.fillStyle=col;
    for(var r=0;r<rows.length;r++)for(var c=0;c<rows[r].length;c++)if(rows[r][c]==="#")ctx.fillRect(Math.round(x)+c,Math.round(y)+r,1,1);
    ctx.globalAlpha=1;
  }

  var BIRD=[["#...#",".#.#.","..#.."],[".....","..#..","##.##"]];
  var NOTE=[["..##","..#.","..#.","###.","##.."],["####","#..#","#..#","#.##","##.."]];
  var birds=[],notes=[],sparks=[],motes=[],f=0;
  for(var i=0;i<14;i++)motes.push({x:150+Math.random()*210,y:60+Math.random()*120,p:Math.random()*6.28});

  function spawnBirds(){
    var n=Math.random()<.5?1:3, y=18+Math.random()*55, v=.18+Math.random()*.12, dir=Math.random()<.75?1:-1;
    for(var k=0;k<n;k++)birds.push({x:dir>0?-8-k*7:W+8+k*7,y:y+(k%2)*4+k*1.5,v:v*dir,ph:Math.random()*6,fr:k*4});
  }
  function spawnNote(){notes.push({x:143,y:139,t:0,ph:Math.random()*6.28,s:Math.random()<.7?0:1});}

  function draw(){
    ctx.globalCompositeOperation="source-over";
    ctx.clearRect(0,0,W,H);

    /* waterfall: light bands running down */
    for(var i=0;i<WF.length;i++){
      var p=WF[i],band=((p[1]-f*0.35)%7+7)%7;
      if(band<2){ctx.fillStyle="rgba(240,248,255,"+(band<1?.55:.3)+")";ctx.fillRect(p[0],p[1],1,1);}
    }
    /* river glints */
    if(f%9===0&&RIV.length){var r=RIV[(Math.random()*RIV.length)|0];sparks.push({x:r[0],y:r[1],t:0});}
    sparks=sparks.filter(function(s){s.t++;var a=s.t<10?s.t/10:(30-s.t)/20;
      ctx.fillStyle="rgba(255,250,225,"+Math.max(0,a)*.85+")";ctx.fillRect(s.x,s.y,1,1);return s.t<30;});

    /* lantern glow */
    ctx.globalCompositeOperation="lighter";
    var fl=.55+.15*Math.sin(f*.21)+.1*Math.sin(f*.53)+(Math.random()<.04?-.2:0);
    var g=ctx.createRadialGradient(120,61,0,120,61,9);
    g.addColorStop(0,"rgba(255,190,90,"+(.55*fl)+")");g.addColorStop(1,"rgba(255,150,60,0)");
    ctx.fillStyle=g;ctx.fillRect(108,49,24,24);
    ctx.fillStyle="rgba(255,225,150,"+(.6*fl)+")";ctx.fillRect(119,59,2,3);
    ctx.globalCompositeOperation="source-over";

    /* golden dust motes */
    motes.forEach(function(m){m.p+=.02;m.y-=.04;m.x+=Math.sin(m.p)*.05;if(m.y<50){m.y=185;m.x=150+Math.random()*210;}
      var a=.25+.25*Math.sin(m.p*3);ctx.fillStyle="rgba(255,236,170,"+Math.max(0,a)+")";ctx.fillRect(Math.round(m.x),Math.round(m.y),1,1);});

    /* birds */
    birds=birds.filter(function(b){b.x+=b.v;b.ph+=.05;b.fr++;
      sprite(BIRD[((b.fr/10)|0)%2],b.x,b.y+Math.sin(b.ph)*1.5,"#221d26");
      return b.x>-20&&b.x<W+20;});

    /* music notes from the headphones */
    notes=notes.filter(function(n){n.t++;n.y-=.12;n.x+=Math.sin(n.ph+n.t*.05)*.18+.03;
      var a=n.t<20?.5:n.t<140?.95:n.t<180?.6:.3;
      sprite(NOTE[n.s],n.x+1,n.y+1,"#2a1d14",a*.6);
      sprite(NOTE[n.s],n.x,n.y,n.t%60<30?"#fff1c4":"#ffd98a",a);
      return n.t<210;});
  }

  function loop(){
    f++;
    if(f%400===1||Math.random()<.0015)spawnBirds();
    if(f%85===0)spawnNote();
    draw();
    requestAnimationFrame(loop);
  }
  img.onload=function(){bctx.drawImage(img,0,0);
    if(still){spawnNote();notes[0].t=60;notes[0].y-=8;draw();return;}
    spawnBirds();spawnNote();requestAnimationFrame(loop);
  };

  /* pixel icons for the planks */
  var ICONS={
    note:["...###..","...#.##.","...#..#.","...#....",".###....","####....","####....",".##....."],
    book:[".######.","#......#","#.####.#","#......#","#.###..#","#......#",".######.","..#..#.."],
    dagger:[".......#","......##",".....##.","....##..","#..##...",".###....",".##.....","#..#...."],
    bar:["........","##....##","##....##","########","##....##","##....##","........","........"],
    gear:["...##...",".######.",".##..##.","###..###","###..###",".##..##.",".######.","...##..."],
    leaf:["....####","...#####","..######",".####.##",".###.###",".##.####",".#.####.","#......."]
  };
  document.querySelectorAll(".plank").forEach(function(b){
    var c=document.createElement("canvas");c.width=8;c.height=8;c.setAttribute("aria-hidden","true");
    var x=c.getContext("2d"),rows=ICONS[b.dataset.icon];
    for(var r=0;r<8;r++)for(var k=0;k<8;k++)if(rows[r][k]==="#"){x.fillStyle=r<2?"#ffe39a":"#f4c16a";x.fillRect(k,r,1,1);}
    b.prepend(c);
  });

  /* RPG dialog */
  var dlg=document.getElementById("dialog"),dt=document.getElementById("dlgTitle"),dx=document.getElementById("dlgText"),timer;
  function say(title,text){
    clearInterval(timer);dt.textContent=title;dx.textContent="";dlg.classList.add("on");
    if(still){dx.textContent=text;return;}
    var i=0;timer=setInterval(function(){dx.textContent=text.slice(0,++i);if(i>=text.length)clearInterval(timer);},28);
  }
  dlg.addEventListener("click",function(){dlg.classList.remove("on");});
  document.querySelectorAll(".plank").forEach(function(b){
    b.addEventListener("click",function(){say(b.dataset.page,"Este caminho ainda está a ser construído. Volta mais tarde.");});
  });
})();
</script>
</body>
</html>
